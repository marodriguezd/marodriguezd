<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Animated focus map for data, AI and software engineering">
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop stop-color="#45E9FF"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#FF79C6"/></linearGradient>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.cream{fill:#FFE1A6}.muted{fill:#909BB4}.cyan{fill:#45E9FF}.pink{fill:#FF79C6}.lav{fill:#C7B6FF}</style>
</defs>
<rect width="960" height="300" rx="18" fill="#0C111E"/><rect x="9" y="9" width="942" height="282" rx="13" fill="none" stroke="#303B55"/>
<text x="32" y="42" class="m pink" font-size="13" font-weight="700" letter-spacing="1.3">FOCUS.MAP</text><text x="928" y="42" text-anchor="end" class="m muted" font-size="11">no rankings · just direction</text>
<path d="M32 58H928" stroke="#303B55"/>
<g stroke="#3A4968" stroke-width="1.5">
  <path d="M480 155L190 105"/><path d="M480 155L770 105"/><path d="M480 155L190 225"/><path d="M480 155L770 225"/>
</g>
<circle cx="480" cy="155" r="50" fill="#111A2D" stroke="url(#g)" stroke-width="2"/>
<text x="480" y="150" text-anchor="middle" class="m cream" font-size="12" font-weight="700">MARODRIGUEZD</text>
<text x="480" y="170" text-anchor="middle" class="m muted" font-size="9">build / ship</text>
<g>
  <circle cx="190" cy="105" r="37" fill="#111A2D" stroke="#45E9FF"/><text x="190" y="101" text-anchor="middle" class="m cyan" font-size="14" font-weight="700">DATA</text><text x="190" y="119" text-anchor="middle" class="m muted" font-size="8.5">Python · SQL</text>
  <circle cx="770" cy="105" r="37" fill="#111A2D" stroke="#FF79C6"/><text x="770" y="101" text-anchor="middle" class="m pink" font-size="14" font-weight="700">AI</text><text x="770" y="119" text-anchor="middle" class="m muted" font-size="8.5">ML · LLMs</text>
  <circle cx="190" cy="225" r="37" fill="#111A2D" stroke="#A78BFA"/><text x="190" y="221" text-anchor="middle" class="m lav" font-size="12" font-weight="700">SOFTWARE</text><text x="190" y="239" text-anchor="middle" class="m muted" font-size="8.5">Java · APIs</text>
  <circle cx="770" cy="225" r="37" fill="#111A2D" stroke="#FFE1A6"/><text x="770" y="221" text-anchor="middle" class="m cream" font-size="13" font-weight="700">LINUX</text><text x="770" y="239" text-anchor="middle" class="m muted" font-size="8.5">Fedora · Git</text>
</g>
<circle cx="480" cy="155" r="58" fill="none" stroke="#45E9FF" opacity=".45"><animate attributeName="r" values="58;75;58" dur="3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".45;0;.45" dur="3.6s" repeatCount="indefinite"/></circle>
</svg>
